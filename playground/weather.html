<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Language — Weather Widget (INST-0001 v2)</title>
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/instances.css">
</head>
<body data-density="compact" style="padding:var(--space-5)">
<h1 style="font:var(--t-title);margin-bottom:var(--space-4)">Weather Widget — INST-0001 v2</h1>

<div class="widget">
  <div class="wg-top">
    <div class="wg-city">Home</div>
    <div class="wg-cond">⛅️</div>
  </div>
  <div class="wg-band">
    <div class="wg-temp">17°</div>
    <div class="wg-hl"><span>L:11°</span><span>H:19°</span></div>
  </div>
  <div class="strip">
    <div class="cell"><span class="cell-hour">6pm</span><span class="cell-glyph">⛅️</span><span class="cell-temp">12°</span></div>
    <div class="cell"><span class="cell-hour">7pm</span><span class="cell-glyph">🌙</span><span class="cell-temp">10°</span></div>
    <div class="cell"><span class="cell-hour">8pm</span><span class="cell-glyph">🌙</span><span class="cell-temp">10°</span></div>
    <div class="cell"><span class="cell-hour">9pm</span><span class="cell-glyph">🌙</span><span class="cell-temp">9°</span></div>
    <div class="cell"><span class="cell-hour">10pm</span><span class="cell-glyph">🌙</span><span class="cell-temp">8°</span></div>
    <div class="cell"><span class="cell-hour">11pm</span><span class="cell-glyph">🌙</span><span class="cell-temp">8°</span></div>
  </div>
</div>

<p style="font:var(--t-footnote);color:var(--label-tertiary);max-width:360px">
G15: glyphs are emoji placeholders — icon layer deferred.</p>
</body>
</html>
